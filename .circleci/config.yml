version: 2.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout
      - setup_remote_docker

      - run:
          name: Check Docker Hub variables
          command: |
            : "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in CircleCI project environment variables}"
            : "${DOCKERHUB_TOKEN:?Set DOCKERHUB_TOKEN in CircleCI project environment variables}"

            DOCKERHUB_REPOSITORY="$(echo "${DOCKERHUB_REPOSITORY:-$CIRCLE_PROJECT_REPONAME}" | tr '[:upper:]' '[:lower:]')"
            echo "export DOCKERHUB_REPOSITORY=\"$DOCKERHUB_REPOSITORY\"" >> "$BASH_ENV"

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - run:
          name: Build Docker image
          command: |
            source "$BASH_ENV"

            IMAGE="$DOCKERHUB_USERNAME/$DOCKERHUB_REPOSITORY"
            RAW_TAG="${CIRCLE_TAG:-$CIRCLE_BRANCH}"
            SAFE_TAG="$(echo "$RAW_TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9_.-]+#-#g' | sed -E 's#^-+|-+$##g' | cut -c1-120)"
            SAFE_TAG="${SAFE_TAG:-build-$CIRCLE_BUILD_NUM}"

            docker build \
              --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL:-}" \
              -t "$IMAGE:$CIRCLE_SHA1" \
              -t "$IMAGE:$SAFE_TAG" \
              .

            if [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; then
              docker tag "$IMAGE:$CIRCLE_SHA1" "$IMAGE:latest"
            fi

            echo "export IMAGE=\"$IMAGE\"" >> "$BASH_ENV"
            echo "export SAFE_TAG=\"$SAFE_TAG\"" >> "$BASH_ENV"

      - run:
          name: Push Docker image
          command: |
            source "$BASH_ENV"

            docker push "$IMAGE:$CIRCLE_SHA1"
            docker push "$IMAGE:$SAFE_TAG"

            if [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; then
              docker push "$IMAGE:latest"
            fi

workflows:
  docker-build-push:
    jobs:
      - build-and-push
